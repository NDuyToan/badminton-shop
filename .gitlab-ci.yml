stages:
  - test

environment-info:
  stage: test
  script:
    - 'echo "Hello from GitLab CI!"'
    - 'echo "Branch: $CI_COMMIT_BRANCH"'
    - 'echo "Pipeline ID: $CI_PIPELINE_ID"'
    - 'echo "Project: $CI_PROJECT_NAME"'
    - 'echo "Working directory: $(pwd)"'
    - 'echo "Files:"'
    - ls -la

node-info:
  stage: test
  script:
    - node --version
    - npm --version
