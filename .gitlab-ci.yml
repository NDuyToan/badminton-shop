image: node:22
stages:
  - test
  - build

cache:
  key:
    files:
      - apps/api/package-lock.json
      - apps/admin/package-lock.json
  paths:
    - .npm/

environment-info:
  stage: test
  script:
    - 'echo "Hello from GitLab CI!"'
    - 'echo "Branch: $CI_COMMIT_BRANCH"'
    - 'echo "Pipeline ID: $CI_PIPELINE_ID"'
    - 'echo "Project: $CI_PROJECT_NAME"'
    - 'echo "Working directory: $(pwd)"'
    - 'echo "Files:"'
    - ls -la

node-info:
  stage: test
  script:
    - node --version
    - npm --version

build-api:
  stage: build
  script:
    - cd apps/api
    - npm ci --cache ../../.npm --prefer-offline
    - npm run build

build-admin:
  stage: build
  script:
    - cd apps/admin
    - npm ci --cache ../../.npm --prefer-offline
    - npm run build
